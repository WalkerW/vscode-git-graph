name: 'Build & Test'

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: '18.20.8'
        cache: 'npm'
    - run: npm ci
    - run: npm run compile
    - run: npm run test
